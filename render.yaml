services:
  - type: cron
    name: ai-news-digest
    runtime: python
    buildCommand: "pip install --no-cache-dir -r requirements.txt"
    startCommand: "python main.py --run-once"
    schedule: "0 8 * * *"
    envVars:
      # Render native Python runtime version (matches .python-version).
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: DATABASE_URL
        sync: false
      - key: NEON_DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: DIGEST_RECIPIENT_EMAIL
        sync: false
      # Optional: Webshare proxy for YouTube transcript fetching.
      - key: PROXY_USERNAME
        sync: false
      - key: PROXY_PASSWORD
        sync: false
