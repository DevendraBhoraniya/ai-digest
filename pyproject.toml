[project]
name = "ai-news-aggregator"
version = "0.1.0"
description = "AI news aggregator: YouTube + blogs -> daily digest email"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "trafilatura>=1.12",
    "google-genai>=1.0",
    "resend>=2.0",
    "apscheduler>=3.10",
    "python-dotenv>=1.0",
    "youtube-transcript-api>=1.2.5",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
